<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#111020">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Бюджет">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Семейный бюджет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F0F6; --surface:#FFFFFF; --surface2:#E9E7F1; --ink:#24213D; --muted:#6C6884; --line:#DCD9E7;
  --accent:#4B3FB8; --accent-ink:#FFFFFF;
  --inc:#1D855E; --exp:#C23E5B; --sav:#2672B0; --plan:#B87A08; --free:#7CC4A4;
  --shadow:0 1px 2px rgba(36,33,61,.06),0 6px 20px rgba(36,33,61,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16152A; --surface:#211F39; --surface2:#2C2A48; --ink:#ECEAF7; --muted:#A29EBF; --line:#37345254;
    --accent:#9A90FF; --accent-ink:#16152A;
    --inc:#4CC596; --exp:#F2708A; --sav:#5AA8EA; --plan:#E8B44A; --free:#3E8A6A;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16152A; --surface:#211F39; --surface2:#2C2A48; --ink:#ECEAF7; --muted:#A29EBF; --line:#37345254;
  --accent:#9A90FF; --accent-ink:#16152A;
  --inc:#4CC596; --exp:#F2708A; --sav:#5AA8EA; --plan:#E8B44A; --free:#3E8A6A;
  --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);}
.hwrap{max-width:560px;margin:0 auto;padding:12px 16px 8px;display:flex;align-items:center;gap:8px}
.month{flex:1;display:flex;align-items:center;justify-content:center;gap:4px}
.month h1{font-size:19px;font-weight:600;margin:0;min-width:150px;text-align:center;letter-spacing:-.01em}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.icon-btn:active{background:var(--surface2)}
.icon-btn svg{width:22px;height:22px}

main{max-width:560px;margin:0 auto;padding:4px 16px calc(140px + env(safe-area-inset-bottom,0px))}
.card{background:var(--surface);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:15px;font-weight:600;margin:0 0 12px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Hero: where the income goes */
.hero-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}
.hero-top .lbl{font-size:15px;color:var(--muted)}
.hero-top .val{font-size:28px;font-weight:700;letter-spacing:-.02em;color:var(--inc)}
.flow{display:flex;height:44px;border-radius:12px;overflow:hidden;background:var(--surface2);gap:2px}
.flow span{display:block;height:100%;min-width:0;transition:flex-basis .4s ease}
.legend{margin-top:14px;display:grid;gap:8px}
.legend .row{font-size:15px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:8px;flex:none}
.verdict{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:15px}
.verdict b{font-weight:600}

.cat{margin-bottom:12px}
.cat:last-child{margin-bottom:0}
.cat .row{font-size:15px;margin-bottom:5px}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{font-size:19px;font-weight:600;margin-top:2px}

/* lists */
.list{display:grid}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border:0;background:none;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.badge{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:700;font-size:15px}
.b-inc{background:color-mix(in srgb,var(--inc) 16%,transparent);color:var(--inc)}
.b-exp{background:color-mix(in srgb,var(--exp) 14%,transparent);color:var(--exp)}
.b-sav{background:color-mix(in srgb,var(--sav) 16%,transparent);color:var(--sav)}
.b-plan{background:color-mix(in srgb,var(--plan) 16%,transparent);color:var(--plan)}
.item .t{flex:1;min-width:0}
.item .t .a{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t .b{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:600;white-space:nowrap}
.c-inc{color:var(--inc)} .c-exp{color:var(--exp)} .c-sav{color:var(--sav)} .c-plan{color:var(--plan)}
.day{font-size:13px;color:var(--muted);margin:16px 4px 6px}
.day:first-child{margin-top:0}

.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.overdue{color:var(--exp)!important;font-weight:500}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:600;font-size:15px;background:var(--surface2);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;color:var(--exp)}
.btn.sm{padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.45}
.link{background:none;border:0;color:var(--accent);font-weight:500;padding:6px 0;font-size:15px}

.goal{padding:4px 0 16px;border-bottom:1px solid var(--line);margin-bottom:14px}
.goal:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.goal h3{margin:0;font-size:17px;font-weight:600}
.goal .bar{height:12px;border-radius:6px;margin:10px 0 8px}
.goal .bar i{background:var(--sav);border-radius:6px}
.goal .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}
.notice{background:color-mix(in srgb,var(--plan) 14%,var(--surface));border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:14px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:8px 0 9px;display:grid;justify-items:center;gap:2px;font-size:11.5px;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:7;
  width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent)}
.fab svg{width:28px;height:28px}

/* sheet */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(15,13,30,.42);display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:90%;overflow:auto;
  padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.flow span{transition:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0 0 14px;font-size:20px;font-weight:600}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:14px;color:var(--muted)}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px;min-height:48px}
.field input.big{font-size:28px;font-weight:600;padding:10px 12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.sheet .acts{display:flex;gap:10px;margin-top:6px}
.sheet .acts .primary{flex:1}
.err{color:var(--exp);font-size:14px;margin:-6px 0 12px;min-height:0}
.catedit{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.catedit span{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border-radius:999px;padding:6px 6px 6px 12px;font-size:14px}
.catedit button{border:0;background:none;width:24px;height:24px;border-radius:50%;color:var(--muted);font-size:16px;line-height:1}
.addrow{display:flex;gap:8px;margin-bottom:18px}
.addrow input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);z-index:30;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

/* v2 additions */
.chart{display:flex;align-items:flex-end;gap:4px;height:170px;margin-top:4px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;height:100%}
.chart .bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.chart .bars i{display:block;width:min(14px,42%);border-radius:4px 4px 0 0;min-height:2px}
.chart .lab{font-size:12px;color:var(--muted)}
.chart .col.cur .lab{color:var(--ink);font-weight:600}
.chart.dense .bars i{width:min(9px,44%)}
.chart.dense .lab{font-size:11px}
.tbl{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;font-size:14px;gap:0}
.tbl>div{padding:8px 0;border-bottom:1px solid var(--line);text-align:right}
.tbl>div:nth-child(4n+1){text-align:left}
.tbl>.th{color:var(--muted);font-size:13px}
.trend{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.trend:last-child{border-bottom:0}
.trend .b{font-size:13px;color:var(--muted)}
.search{margin-bottom:12px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px}
.tpls{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding:0 0 2px;scrollbar-width:none;max-width:100%}
.tpls::-webkit-scrollbar{display:none}
.tpl{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;font-size:14px;text-align:left;line-height:1.25}
.tpl small{display:block;color:var(--muted);font-size:12px}
.check{display:flex;align-items:center;gap:10px;margin:-2px 0 14px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.lim-in{width:110px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-size:16px;text-align:right}
.limrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.limrow:last-child{border-bottom:0}
.c-warn{color:var(--plan)}
nav.tabs .in{grid-template-columns:repeat(5,1fr)}
nav.tabs button{font-size:11px}
.daily{margin-top:14px;padding:14px;border-radius:14px;background:var(--surface2)}
.daily .big{font-size:24px;font-weight:700;letter-spacing:-.01em;margin:2px 0 4px}
.daily .fc{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.splitbox{background:var(--surface2);border-radius:14px;padding:12px;margin:-4px 0 14px}
.sprow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.sprow select{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-size:16px}
.sprow input{width:100px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-size:16px;text-align:right}
.toast.show.act{pointer-events:auto}
.toast button{margin-left:14px;background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;font-size:14px;padding:0}
.plan{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--surface2)}
.flabel{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.cgrid{display:flex;flex-wrap:wrap;gap:6px}
.cchip{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 11px;font-size:14px;display:inline-flex;gap:6px;align-items:center;line-height:1.2}
.cchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cchip.more{color:var(--accent);font-weight:500}
.cg-t{font-size:13px;color:var(--muted);margin:12px 0 6px}
.grp{display:block;width:100%;background:none;border:0;padding:0;text-align:left;margin-bottom:12px;color:inherit}
.sub{margin:-4px 0 14px 6px;padding-left:12px;border-left:2px solid var(--line);display:grid;gap:6px}
.mgrp{margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.mrow{display:flex;align-items:center;gap:4px;padding:5px 0}
.mhead{font-weight:600}
.mic{width:30px;text-align:center;font-size:18px;flex:none}
.mname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mname small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.icon-btn.sm{width:34px;height:34px;font-size:16px}
.icon-btn.sm svg{width:18px;height:18px}
.icon-btn:disabled{opacity:.25}
.icons{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.ico{width:40px;height:40px;border:0;background:var(--surface2);border-radius:10px;font-size:20px;padding:0}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.lim-g{margin-top:6px}
.lim-i label{padding-left:14px}
.badge{font-size:17px}
.overlay{overscroll-behavior:contain}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* v5: payments and no sideways scrolling */
html,body{overflow-x:hidden;max-width:100%}
.sheet{overflow-x:hidden;overflow-y:auto}
.sheet .field input,.sheet .field select{display:block;max-width:100%;min-width:0}
.sheet input[type="date"]{-webkit-appearance:none;appearance:none;text-align:left;line-height:24px}
.sheet input[type="date"]::-webkit-date-and-time-value{text-align:left}
.sheet .seg,.sheet .splitbox,.sheet .cgrid,.sheet .icons{max-width:100%}
.pay{display:grid;grid-template-columns:40px minmax(0,1fr) auto;column-gap:12px;row-gap:10px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.pay:last-child{border-bottom:0}
.pay .badge{grid-column:1;grid-row:1;font-size:18px}
.pay .t{grid-column:2;grid-row:1;min-width:0;padding-top:1px}
.pay .t .a{font-weight:500;line-height:1.3;overflow-wrap:break-word}
.pay .t .b{font-size:13px;color:var(--muted);margin-top:2px}
.pay .amt{grid-column:3;grid-row:1;padding-top:1px;white-space:nowrap}
.pacts{grid-column:2/4;grid-row:2;display:flex;gap:8px}
.pacts .btn{flex:1}
.paynow{width:100%;margin-bottom:10px;padding:14px}
/* v6: motivation */
.chips-row{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 12px}
.chips-row:empty{display:none}
.pill{background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;box-shadow:var(--shadow)}
.stars{font-size:26px;color:#E8A317;letter-spacing:2px;margin:6px 0 2px}
.stars span{color:var(--line)}
.ch.won{background:color-mix(in srgb,var(--inc) 12%,var(--surface))}
.ch-start{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1.5px dashed var(--line);background:transparent;border-radius:20px;padding:14px 16px;margin-bottom:14px;color:inherit}
.ch-start>span:first-child{font-size:26px}
.ch-start b{display:block;font-weight:600}
.ch-start small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.cal-wd,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-wd span{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.cd{aspect-ratio:1/1;border-radius:10px;border:0;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:600;background:var(--surface2);color:var(--ink);line-height:1.1;min-width:0}
.cd small{font-size:9.5px;font-weight:500;opacity:.85}
.cd.empty{background:transparent}
.cd.future{background:transparent;color:var(--muted);font-weight:400;border:1px dashed var(--line)}
.cd.ok{background:color-mix(in srgb,var(--inc) 22%,var(--surface));color:var(--inc)}
.cd.over{background:color-mix(in srgb,var(--exp) 22%,var(--surface));color:var(--exp)}
.cd.zero{background:var(--surface2);color:var(--muted)}
.cd.today{outline:2px solid var(--accent);outline-offset:1px}
.awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.aw{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);opacity:.75}
.aw .aw-i{font-size:30px;filter:grayscale(1);opacity:.45}
.aw.got{opacity:1;background:linear-gradient(160deg,color-mix(in srgb,#E8A317 16%,var(--surface)),var(--surface))}
.aw.got .aw-i{filter:none;opacity:1}
.aw-t{font-weight:600;font-size:15px;margin-top:6px}
.aw-d{font-size:12.5px;color:var(--muted);margin-top:2px}
.gtop{display:flex;gap:14px;align-items:center}
.jar{width:54px;flex:none}
.jar-lid{height:8px;margin:0 8px;border-radius:4px 4px 0 0;background:var(--muted);opacity:.55}
.jar-body{height:70px;border:2.5px solid var(--muted);border-top-width:2px;border-radius:8px 8px 16px 16px;overflow:hidden;position:relative;background:var(--surface2)}
.jar-fill{position:absolute;left:0;right:0;bottom:0;height:0;transition:height 1.1s cubic-bezier(.2,.8,.2,1);
  background:radial-gradient(circle at 30% 40%,#F6D365 0 4px,transparent 5px),radial-gradient(circle at 70% 70%,#F6D365 0 4px,transparent 5px),linear-gradient(#E8A317,#C98A12);background-size:18px 14px,22px 16px,auto}
@media (prefers-reduced-motion:reduce){.jar-fill{transition:none}}
.goal.has-photo{border-bottom:0;padding-bottom:16px}
.gphoto{border-radius:16px;background-size:cover;background-position:center;min-height:170px;display:flex;align-items:flex-end;overflow:hidden;margin-bottom:10px}
.gph-in{width:100%;padding:14px 14px 12px;color:#fff;background:linear-gradient(transparent,rgba(10,8,25,.72))}
.gph-in h3{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.gph-in .icon-btn{color:#fff;background:rgba(0,0,0,.25)}
.gph-sum{font-size:24px;font-weight:700}
.gph-sum span{font-size:14px;font-weight:500;opacity:.85}
.gbar{background:rgba(255,255,255,.3)!important;margin:8px 0 0!important}
.gbar i{background:#fff!important}
#ph-prev img{display:block;width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin-bottom:8px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti span{position:absolute;top:-40px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.seg button{padding:9px 4px}
.carry{background:color-mix(in srgb,var(--inc) 9%,var(--surface))}
.carry-acts{display:flex;gap:8px;flex-wrap:wrap}
.carry-acts .btn{flex:1 1 auto}
.syncbar{max-width:560px;margin:0 auto 6px;padding:7px 14px;font-size:13px;text-align:center;color:var(--muted)}
.syncbar.off{background:color-mix(in srgb,var(--plan) 16%,var(--surface));color:var(--ink);border-radius:12px;width:calc(100% - 32px)}
.syncbar[hidden]{display:none}
/* v10: refined look, dark theme */
:root{--cardline:transparent;--glass:color-mix(in srgb,var(--bg) 82%,transparent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111020;--surface:#1B1A2D;--surface2:#262439;--ink:#EEECFA;--muted:#9C98B8;--line:rgba(255,255,255,.08);
  --accent:#A39AFF;--accent-ink:#141228;--inc:#4FD1A0;--exp:#FF7D96;--sav:#6CB5F5;--plan:#F0BE55;--free:#2E7C60;
  --shadow:none;--cardline:rgba(255,255,255,.06);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111020;--surface:#1B1A2D;--surface2:#262439;--ink:#EEECFA;--muted:#9C98B8;--line:rgba(255,255,255,.08);
  --accent:#A39AFF;--accent-ink:#141228;--inc:#4FD1A0;--exp:#FF7D96;--sav:#6CB5F5;--plan:#F0BE55;--free:#2E7C60;
  --shadow:none;--cardline:rgba(255,255,255,.06);color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
html{background:var(--bg)}
.card,.stat,.aw,.pill{border:1px solid var(--cardline)}
header,body::before{background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px)}
nav.tabs{background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px)}
nav.tabs button svg{width:52px;height:30px;padding:3px 14px;box-sizing:border-box;border-radius:15px;transition:background .2s}
nav.tabs button[aria-current="page"] svg{background:color-mix(in srgb,var(--accent) 16%,transparent)}
nav.tabs button[aria-current="page"]{font-weight:600}
.fab{transition:transform .15s}
.fab:active{transform:scale(.94)}
.btn:active,.item:active,.cchip:active,.chip:active{opacity:.75}
/* hero */
.hero-main{margin-bottom:16px}
.hero-main .lbl{font-size:14px;color:var(--muted)}
.hero-num{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1.08;margin:2px 0 4px}
.hero-sub{font-size:13.5px;color:var(--muted);line-height:1.4}
.inc-row{font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:2px}
.hero .fc{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.hero .verdict+.fc{border-top:0;padding-top:0;margin-top:10px}
/* phrase of the day */
.phrase{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;margin:0 0 14px;padding:16px 16px 16px 14px;border-radius:20px;
  border:1px solid var(--cardline);color:var(--ink);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 11%,var(--surface)),var(--surface) 70%);box-shadow:var(--shadow)}
.phrase .qm{font-family:Georgia,"Times New Roman",serif;font-size:46px;line-height:.8;color:var(--accent);opacity:.75;flex:none;margin-top:2px}
.phrase .ptext{flex:1;min-width:0}
.phrase .en{display:block;font-size:17px;line-height:1.38;font-weight:600;letter-spacing:-.01em}
.phrase .ru{display:block;font-size:13px;color:var(--muted);margin-top:6px;line-height:1.4}
.phrase .by{white-space:nowrap}
.phrase .pnext{flex:none;color:var(--muted);opacity:.6;margin-top:2px}
.phrase .pnext svg{width:18px;height:18px;display:block}
/* operations: day totals */
.day{display:flex;justify-content:space-between;gap:10px}
/* sheet & inputs in dark */
.field input,.field select,.search input,.addrow input,.lim-in,.sprow select,.sprow input{color:var(--ink)}
.overlay{background:rgba(5,4,15,.5)}
.pill{background:var(--surface)}
.jar-body{background:var(--surface2)}
nav.tabs button{white-space:nowrap}
.card .acts{display:flex;gap:8px;flex-wrap:wrap}
.legend[style*="grid-auto-flow:column"]{display:flex!important;flex-wrap:wrap;gap:6px 16px!important}
.legend .small{white-space:nowrap}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--ink) 12%,var(--surface2))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--ink) 12%,var(--surface2))}}
/* v11: no page overscroll on iPhone */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%}
.scroller{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:none;
  padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
.scroller>main{min-height:calc(100% + 2px)}
.sheet{overscroll-behavior:none}
/* v13: standalone app */
body.setup nav.tabs,body.setup .fab,body.setup .month,body.setup [data-act="settings"]{visibility:hidden}
.connect{margin-top:28px;text-align:left}
.cn-icon{font-size:44px;margin-bottom:8px}
.codebox{display:block;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font-size:16px;font-family:ui-monospace,Menlo,monospace;resize:none;min-height:84px;word-break:break-all}
@media (display-mode: standalone){:root[data-theme="light"] body::before{background:var(--accent);-webkit-backdrop-filter:none;backdrop-filter:none}}
.cn-img{width:72px;height:72px;border-radius:17px;display:block;margin-bottom:12px}
/* v14: fixed header (status-bar area counted once) and no empty strip under the tab bar */
header{position:fixed!important;top:0!important;left:0;right:0;z-index:8;padding-top:env(safe-area-inset-top,0px);
  background:color-mix(in srgb,var(--bg) 94%,transparent)!important}
body::before{display:none!important}
.scroller{padding-top:var(--hdr,calc(env(safe-area-inset-top,0px) + 64px))!important}
/* app window shorter than the screen (iOS home-screen app): no home-indicator padding inside the window */
html.vgap nav.tabs{padding-bottom:8px}
html.vgap .fab{bottom:76px}
html.vgap .toast{bottom:150px}
html.vgap .sheet{padding-bottom:18px}
html.vgap main{padding-bottom:120px}
@media (display-mode: standalone){:root[data-theme="light"] header{background:var(--accent)!important;color:#fff}
  :root[data-theme="light"] header .icon-btn{color:#fff}:root[data-theme="light"] header .syncbar{color:#fff}}
nav.tabs{background:color-mix(in srgb,var(--surface) 97%,transparent)!important}
/* v17: keep the tab bar inside the part of the screen iOS really shows */
nav.tabs{bottom:var(--hide,0px)!important}
html.vgap .fab{bottom:calc(76px + var(--hide,0px))}
html.vgap .toast{bottom:calc(150px + var(--hide,0px))}
.overlay{bottom:var(--hide,0px)}
/* v18: swipe-to-close sheets */
.sheet{transition:transform .22s cubic-bezier(.2,.8,.2,1);will-change:transform;touch-action:pan-y}
.sheet.dragging{transition:none}
.grab{padding:10px 0;margin:-10px auto 2px;width:60px;height:5px;box-sizing:content-box;background-clip:content-box;cursor:grab}
/* v19: experiment — let the app draw below the window iOS gives it (translucent status bar) */
html.stretch,html.stretch body{overflow:visible!important}
html.stretch .scroller{bottom:calc(-1 * var(--below,0px))!important}
html.stretch nav.tabs{bottom:calc(-1 * var(--below,0px))!important}
html.stretch .fab{bottom:calc(76px + env(safe-area-inset-bottom,0px) - var(--below,0px))!important}
html.stretch .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px) - var(--below,0px))!important}
html.stretch .overlay{bottom:calc(-1 * var(--below,0px))!important}
/* v20: never wider than the screen */
html,body{max-width:100vw;overflow-x:hidden;touch-action:pan-y pinch-zoom}
html.stretch,html.stretch body{overflow-y:visible!important}
input,select,textarea{font-size:max(16px,1em)}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div style="width:40px"></div>
    <div class="month">
      <button class="icon-btn" data-act="prev" aria-label="Предыдущий месяц"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>

    </div>
    <button class="icon-btn" data-act="settings" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>
  <div id="syncbar" class="syncbar" hidden></div>
</header>

</div>

<nav class="tabs" aria-label="Разделы"><div class="in">
  <button data-tab="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 15v-3M12 15V9M17 15v-5"/></svg>Обзор</button>
  <button data-tab="ops"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Операции</button>
  <button data-tab="payments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Платежи</button>
  <button data-tab="savings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9M9.5 10a2.5 2 0 0 1 2.5-1.8c1.5 0 2.5.8 2.5 1.9 0 2.6-5 1.4-5 4 0 1.1 1 1.9 2.5 1.9a2.5 2 0 0 0 2.5-1.8"/></svg>Цели</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>Итоги</button>
</div></nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
const $ = s => document.querySelector(s);
const fmtE = new Intl.NumberFormat('ru-RU',{style:'currency',currency:'EUR'});
const fmt0 = new Intl.NumberFormat('ru-RU',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const money = n => {const v=Math.round((n||0)*100)/100;return Number.isInteger(v)?fmt0.format(v):fmtE.format(v)};
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MSHORT=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const MGEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MPREP=['январе','феврале','марте','апреле','мае','июне','июле','августе','сентябре','октябре','ноябре','декабре'];
const WD=['вс','пн','вт','ср','чт','пт','сб'];
const REPEAT={none:'Один раз',month:'Каждый месяц',year:'Каждый год'};

const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const curMonth=()=>today().slice(0,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shiftMonth(m,n){let [y,mo]=m.split('-').map(Number);mo+=n;while(mo>12){mo-=12;y++}while(mo<1){mo+=12;y--}return y+'-'+pad(mo)}
function addPeriod(date,rep){const [y,m,d]=date.split('-').map(Number);let ny=y,nm=m;
  if(rep==='month'){nm++;if(nm>12){nm=1;ny++}} else if(rep==='year'){ny++} else return date;
  const last=new Date(ny,nm,0).getDate();return ny+'-'+pad(nm)+'-'+pad(Math.min(d,last));}
const dayLabel=ds=>{const [y,m,d]=ds.split('-').map(Number);return d+' '+MGEN[m-1]};
const dayLong=(ds,withYear)=>{const [y,m,d]=ds.split('-').map(Number);const w=new Date(y,m-1,d).getDay();return d+' '+MGEN[m-1]+(withYear&&String(y)!==today().slice(0,4)?' '+y:'')+', '+WD[w]};
const parseAmt=v=>{const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?Math.round(n*100)/100:NaN};
const pct=(a,b)=>b?Math.round((a-b)/b*100):0;

const S={tx:[],planned:[],goals:[],templates:[],debts:[],challenges:[],photos:{},jar:{},phraseShift:0,day:'',cats:null,openGroups:new Set(),reminders:{owner:''},me:'',
  month:curMonth(),tab:'overview',txFilter:'all',q:'',statsMode:'months',showPaid:false,loaded:false,noDb:false,err:''};
let myId=null;

/* ---------- categories ---------- */
const GROUP_COLORS=['#6D5BD0','#D0577A','#2E86C1','#C98A12','#2BA37A','#9A5BC2','#D36D3A','#3E9BA8','#8A8F2E','#B04E9C','#5B7BD0','#C0504D','#4F9D69','#7B7F95'];
const ICONS=['🛒','☕','🛵','🍽️','🍷','🏠','🔑','💡','🧹','🛋️','🚗','🚌','🚕','⛽','🔧','🅿️','✈️','💊','🩺','🦷','👶','🏫','🎨','🧸','👗','👟','💇','🧴','📱','🌐','📺','🎬','🎮','🏋️','🧶','📚','🎓','🎁','🎉','💝','🐾','🏦','🧾','🛡️','💸','📦','💼','💻','↩️','📈','💰','⭐'];
const APP_VERSION='21';
const PEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>';
const cfg=()=>S.cats||{expense:[],income:[]};
const expGroups=()=>cfg().expense;
let _cm=null,_cmSrc=null,_cmVer=0,catVer=0;
function catMap(){if(_cmSrc!==S.cats||_cmVer!==catVer){_cmSrc=S.cats;_cmVer=catVer;_cm={};expGroups().forEach((g,gi)=>g.items.forEach((it,ii)=>{_cm[it.name]={g,it,gi,ii}}))}return _cm}
const expCats=()=>expGroups().flatMap(g=>g.items.filter(i=>!i.hidden).map(i=>i.name));
const incCats=()=>cfg().income.filter(i=>!i.hidden).map(i=>i.name);
function groupColor(g){if(g.color)return g.color;const i=expGroups().indexOf(g);return i<0?'#7B7F95':GROUP_COLORS[i%GROUP_COLORS.length]}
const catColor=n=>{const c=catMap()[n];return c?groupColor(c.g):'#7B7F95'};
function catIcon(n,type){if(type==='income'){const i=cfg().income.find(x=>x.name===n);return (i&&i.icon)||'💰'}const c=catMap()[n];return c?(c.it.icon||c.g.icon||'📦'):'📦'}
const kindOf=n=>{const c=catMap()[n];return c?(c.it.kind||'need'):'want'};
function limits(){const L={};expGroups().forEach(g=>{if(g.limit>0)L['g:'+g.group]=g.limit;g.items.forEach(i=>{if(i.limit>0)L[i.name]=i.limit})});return L}
function saveCats(){catVer++;render();const nv=stamp();const base=S.catVersion||'';const rn=S.pendingRenames||[];S.pendingRenames=[];S.catVersion=nv;return write(()=>call('saveCategories',S.cats,base,rn,nv))}
function groupTotals(cats){
  const out=new Map();
  for(const [n,v] of Object.entries(cats)){const c=catMap()[n];const key=c?c.g.group:'__none';
    if(!out.has(key))out.set(key,{g:c?c.g:{group:'Без группы',icon:'📦',color:'#7B7F95',items:[]},total:0,items:[]});
    const r=out.get(key);r.total+=v;r.items.push([n,v]);}
  return [...out.values()].map(r=>{r.items.sort((a,b)=>b[1]-a[1]);return r}).sort((a,b)=>b.total-a.total);
}
function needWant(cats){let need=0,want=0;for(const [n,v] of Object.entries(cats)){if(kindOf(n)==='need')need+=v;else want+=v}return {need,want}}
function renameCat(type,from,to){
  const ex=type==='expense';
  S.tx.forEach(t=>{if(t.category===from&&t.type===type)t.category=to});
  S.planned.forEach(p=>{if(p.category===from&&(isInc(p)!==ex))p.category=to});
  S.templates.forEach(t=>{if(t.category===from&&(t.type===type))t.category=to});
  S.debts.forEach(d=>{if(d.category===from&&((d.dir!=='lent')===ex))d.category=to});
  (S.pendingRenames=S.pendingRenames||[]).push([type,from,to]);
}
function catSelect(id,type,sel){
  if(type==='income'){const a=incCats();return '<select id="'+id+'">'+opt(a,sel||a[0])+'</select>'}
  let h='<select id="'+id+'">',found=false;
  for(const g of expGroups()){const its=g.items.filter(i=>!i.hidden||i.name===sel);if(!its.length)continue;
    h+='<optgroup label="'+esc((g.icon?g.icon+' ':'')+g.group)+'">'+its.map(i=>{if(i.name===sel)found=true;return '<option value="'+esc(i.name)+'"'+(i.name===sel?' selected':'')+'>'+esc(i.name)+'</option>'}).join('')+'</optgroup>'}
  if(sel&&!found)h+='<option selected>'+esc(sel)+'</option>';
  return h+'</select>';
}
const isInc=p=>p.flow==='income';
const tagsOf=t=>Array.isArray(t.tags)?t.tags:[];
function parseTags(s){const out=[];String(s||'').split(',').forEach(x=>{x=x.trim().replace(/^#+/,'');if(x&&!out.some(y=>y.toLowerCase()===x.toLowerCase()))out.push(x)});return out}
function allTags(){const m={};for(const t of S.tx)for(const g of tagsOf(t)){const k=g.toLowerCase();if(!m[k])m[k]={tag:g,n:0,last:''};m[k].n++;if(t.date>m[k].last)m[k].last=t.date}return Object.values(m).sort((a,b)=>a.last<b.last?1:-1)}
const debtPaid=d=>S.tx.filter(t=>t.debtId===d.id).reduce((s,t)=>s+Math.abs(Number(t.amount)||0),0);
const daysIn=m=>new Date(+m.slice(0,4),+m.slice(5),0).getDate();
const onDay=(ym,day)=>ym+'-'+pad(Math.min(day,daysIn(ym)));
function nextDue(day){const t=today();let ds=onDay(t.slice(0,7),day);if(ds<t)ds=onDay(shiftMonth(t.slice(0,7),1),day);return ds}
const debtPlan=d=>S.planned.find(p=>p.debtId===d.id&&!p.paid);

/* ---------- toast ---------- */
let tt;function toast(msg,action){const t=$('#toast');t.textContent=msg;t.classList.toggle('act',!!action);
  if(action){const b=document.createElement('button');b.textContent=action.label;b.onclick=()=>{t.classList.remove('show');clearTimeout(tt);action.fn()};t.appendChild(b)}
  t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),action?6000:3000)}

/* ---------- Google Apps Script bridge ---------- */
// Two ways to talk to the spreadsheet: inside the Google page (google.script.run)
// or from the standalone app on GitHub Pages through the protected API address.
const GAS=!!(window.google&&google.script&&google.script.run);
const LSC={get(k){try{return localStorage.getItem('fb:'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem('fb:'+k,v)}catch(e){}},del(k){try{localStorage.removeItem('fb:'+k)}catch(e){}}};
let CONN=null;try{CONN=JSON.parse(LSC.get('conn')||'null')}catch(e){CONN=null}
function parseCode(s){const m=String(s||'').match(/FB1\.([A-Za-z0-9_\-=]+)/);if(!m)return null;

function apiCall(conn,fn,args){
  const ac=new AbortController();const t=setTimeout(()=>ac.abort(),30000);
  return fetch(conn.u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:conn.k,fn,args}),signal:ac.signal,redirect:'follow',cache:'no-store'})
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(j=>{if(!j.ok)throw new Error(j.error||'Ошибка сервера');return j.result})
    .catch(e=>{if(e&&e.name==='AbortError')throw new Error('timeout');throw e}).finally(()=>clearTimeout(t));
}

const isNetErr=e=>!navigator.onLine||/network|http 0|http 5\d\d|connection|timed? ?out|failed to fetch|load failed|offline|unauthorized|не удалось подключиться/i.test(String((e&&e.message)||e));
function call(fn,...args){outbox.push({fn,args});saveOutbox();syncBar();flush();scheduleCache();return Promise.resolve(true)}
async function flush(){
  if(flushing)return;flushing=true;
  try{
    while(outbox.length){const it=outbox[0];
      try{const r=await run(it.fn,...it.args);outbox.shift();saveOutbox();S.offline=false;if(r&&r.skipped){conflicts.push(r.message);showConflicts()}}
      catch(e){if(isNetErr(e)){S.offline=true;break}outbox.shift();saveOutbox();toast('Не получилось сохранить: '+((e&&e.message)||'ошибка'))}

}

function localUpsert(kind,id,data,merge){
  const arr=S[kind];const i=arr.findIndex(x=>x.id===id);
  const obj=merge&&i>=0?{...arr[i],...data,id}:{...data,id};
  if(i>=0)arr[i]=obj;else arr.push(obj);return obj;
}
// Changes show instantly and are saved to the sheet in the background.
// Every change carries a stamp; the server compares it with what this phone last saw,
// so a change made by the partner in the meantime is never silently overwritten.
const stamp=()=>'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const baseOf=(k,id)=>{const p=S[k].find(x=>x.id===id);return p?String(p.updatedAt||''):null};
const db={
  doc(path){const [k,id]=path.split('/');return{
    set:d=>{const base=baseOf(k,id);const o=localUpsert(k,id,{...d,updatedAt:stamp()},false);render();return call('upsert',k,o,base)},
    update:d=>{const base=baseOf(k,id);const o=localUpsert(k,id,{...d,updatedAt:stamp()},true);render();return call('upsert',k,o,base)},
    delete:()=>{const base=baseOf(k,id)||'';S[k]=S[k].filter(x=>x.id!==id);render();return call('remove',k,id,base)}
  }},
  collection(k){return{doc:()=>db.doc(k+'/'+newId())}}
};

/* ---------- calculations ---------- */
function sums(m){
  let inc=0,exp=0,sav=0,carry=0,n=0;const cats={};
  for(const t of S.tx){if(!t.date||t.date.slice(0,7)!==m)continue;n++;const a=Number(t.amount)||0;
    if(t.type==='income')inc+=a;else if(t.type==='expense'){exp+=a;const c=t.category||'Другое';cats[c]=(cats[c]||0)+a}else if(t.type==='saving')sav+=a;else if(t.type==='carry')carry+=a;}
  return {inc,exp,sav,carry,cats,n};
}
function monthData(m){
  const s=sums(m);const tx=S.tx.filter(t=>t.date&&t.date.slice(0,7)===m);
  let planned=[],incoming=[];
  if(m>=curMonth()){
    planned=S.planned.filter(p=>!p.paid&&!isInc(p)&&p.dueDate&&p.dueDate.slice(0,7)<=m);
    incoming=S.planned.filter(p=>!p.paid&&isInc(p)&&p.dueDate&&p.dueDate.slice(0,7)<=m);
  }
  const plan=planned.reduce((a,p)=>a+(Number(p.amount)||0),0);
  const expInc=incoming.reduce((a,p)=>a+(Number(p.amount)||0),0);
  return {...s,tx,plan,planned,expInc,free:s.inc+s.carry-s.exp-s.sav-plan};
}
function goalPlan(g){
  const tg=Number(g.target)||0,dl=String(g.deadline||'').slice(0,7);
  const total=goalSaved(g);
  if(!tg)return null;
  if(total>=tg)return {done:true};
  if(!/^\d{4}-\d{2}$/.test(dl))return {noDeadline:true};
  const cm=curMonth();
  if(dl<cm)return {overdue:true,missing:tg-total,dl};
  const mine=S.tx.filter(t=>t.type==='saving'&&t.goalId===g.id&&t.date);
  const before=mine.filter(t=>t.date.slice(0,7)<cm).reduce((s,t)=>s+(Number(t.amount)||0),0);
  const thisM=mine.filter(t=>t.date.slice(0,7)===cm).reduce((s,t)=>s+(Number(t.amount)||0),0);
  const [dy,dm]=dl.split('-').map(Number),[cy,cmo]=cm.split('-').map(Number);
  const monthsLeft=(dy-cy)*12+(dm-cmo)+1;
  const need=Math.max(0,(tg-before)/monthsLeft);
  const leftThis=Math.max(0,need-thisM);
  const nextNeed=monthsLeft>1?Math.max(0,(tg-total)/(monthsLeft-1)):0;
  return {need,thisM,leftThis,monthsLeft,nextNeed,dl};
}

const goalSaved=g=>S.tx.filter(t=>t.type==='saving'&&t.goalId===g.id).reduce((s,t)=>s+(Number(t.amount)||0),0);

/* ----- motivation: norms, calendar, streaks ----- */
const isVar=x=>x.type==='expense'&&!x.plannedId&&!x.debtId&&!x.fromSavings;
const LS={get(k){try{return localStorage.getItem('fb:'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem('fb:'+k,v)}catch(e){}}};
function monthNorm(m){
  const d=monthData(m),dim=daysIn(m);
  const fixed=d.tx.filter(x=>x.type==='expense'&&!isVar(x)).reduce((s,x)=>s+(Number(x.amount)||0),0);
  const pool=d.inc+d.carry+(m===curMonth()?d.expInc:0)-fixed-d.plan-Math.max(0,d.sav);
  return pool>0?pool/dim:0;
}
function daySpend(){const m={};for(const t of S.tx)if(isVar(t)&&t.date)m[t.date]=(m[t.date]||0)+(Number(t.amount)||0);return m}
const ymd=dt=>dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
function dayStatus(date,spend,norms){
  const m=date.slice(0,7);if(!(m in norms))norms[m]=monthNorm(m);const n=norms[m],v=spend[date]||0;
  if(!n)return {s:'none',v,n};if(!v)return {s:'zero',v,n};return {s:v<=n?'ok':'over',v,n};
}
function streakInfo(){
  const spend=daySpend(),norms={};const first=S.tx.reduce((a,t)=>t.date&&(!a||t.date<a)?t.date:a,'');
  if(!first)return {cur:0,best:0};
  const t=today();let dt=new Date();let cur=0,run=0,best=0,counting=true;
  const td=dayStatus(t,spend,norms);
  if(td.s==='ok'||td.s==='zero'){cur=1;run=1}else if(td.s==='over'){counting=false}
  for(let i=1;i<200;i++){dt.setDate(dt.getDate()-1);const ds=ymd(dt);if(ds<first)break;
    const st=dayStatus(ds,spend,norms);
    if(st.s==='ok'||st.s==='zero'){run++;if(counting)cur++}else{counting=false;best=Math.max(best,run);run=0;if(st.s==='none')break}}
  best=Math.max(best,run,cur);return {cur,best};
}
function monthOk(m){const s=sums(m);return s.inc+Math.max(0,s.carry)>0&&s.inc+s.carry-s.exp-Math.max(0,s.sav)>=-0.005}
function okMonthsInRow(){let n=0,m=shiftMonth(curMonth(),-1);for(let i=0;i<36;i++){if(!monthOk(m))break;n++;m=shiftMonth(m,-1)}return n}

/* ----- daily budget & forecast ----- */
function dailyInfo(d){
  if(!d.inc&&!d.expInc&&!(d.carry>0))return null;
  const dim=daysIn(S.month),t=today(),day=+t.slice(8),left=dim-day+1;
  const spentToday=d.tx.filter(x=>isVar(x)&&x.date===t).reduce((s,x)=>s+(Number(x.amount)||0),0);
  const pool=d.inc+d.carry+d.expInc-d.exp-d.sav-d.plan+spentToday;
  const per=pool/left,todayLeft=per-spentToday;
  const varSpent=d.tx.filter(isVar).reduce((s,x)=>s+(Number(x.amount)||0),0);
  const fixed=d.exp-varSpent;const mi=Number(S.month.slice(5))-1;
  let fc='<div class="fc">';
  if(day<3||!varSpent)fc+='<span class="small muted">Прогноз на конец месяца появится через пару дней, когда станет понятен темп трат.</span>';
  else{const proj=varSpent/day*dim+fixed+d.plan;const rest=d.inc+d.carry+d.expInc-d.sav-proj;
    fc+='<span class="small">📈 В том же темпе к '+dim+' '+MGEN[mi]+' уйдёт около <b class="num">'+money(Math.round(proj))+'</b> и '+(rest>=0?'останется <b class="num c-inc">'+money(Math.round(rest))+'</b>':'<b class="c-exp">не хватит '+money(Math.round(-rest))+'</b>')+'.</span>';}
  fc+='</div>';
  return {pool,per,todayLeft,left,spentToday,fc};
}

function doCarry(m,toSave,goalId){

  if(toSave>0)list.push({type:'saving',goalId:goalId||'',amount:toSave,date:lastDay(m),note:'Остаток '+mGen(m),pairId:'carry-'+m+'-s'});
  if(rest>0.005){const pid='carry-'+m+'-'+newId().slice(-4);
    list.push({type:'carry',amount:-rest,date:lastDay(m),note:'Перенесено в '+MONTHS[Number(nm.slice(5))-1].toLowerCase(),pairId:pid});
    list.push({type:'carry',amount:rest,date:nm+'-01',note:'Остаток с '+mGen(m),pairId:pid});}
  const rows=list.map((t,i)=>localUpsert('tx',newId()+i,{...t,who:myId||'',createdAt:Date.now()+i,updatedAt:stamp()},false));

/* ----- month report with grade ----- */
function reportCard(){
  const day=+today().slice(8);if(day>10)return '';
  const pm=shiftMonth(curMonth(),-1);if(LS.get('rep-'+pm)==='1')return '';
  const s=sums(pm);if(!s.inc&&!s.exp)return '';
  const mi=Number(pm.slice(5))-1;
  const free=s.inc+s.carry-s.exp-Math.max(0,s.sav),rate=s.inc?s.sav/s.inc:0;
  const L=limits();const gt=groupTotals(s.cats);
  const limKeys=Object.keys(L);const broken=limKeys.filter(k=>(k.startsWith('g:')?((gt.find(r=>r.g.group===k.slice(2))||{}).total||0):(s.cats[k]||0))>L[k]);

function checkMilestones(g,before,after){

  if(!hit.length)return;const top=Math.max(...hit);

  r.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error('Этот формат фото не поддерживается'));img.onload=()=>{
    let w=img.width,h=img.height;const max=900;if(w>max){h=Math.round(h*max/w);w=max}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    let q=0.75,out=c.toDataURL('image/jpeg',q);while(out.length>240000&&q>0.35){q-=0.1;out=c.toDataURL('image/jpeg',q)}res(out)};img.src=r.result};r.readAsDataURL(file)})}

/* ----- operations ----- */
function txRow(t){
  let cls='exp',sign='−',title=t.category||'Другое',ini=catIcon(t.category,t.type);
  if(t.type==='income'){cls='inc';sign='+'}
  else if(t.type==='carry'){cls='sav';title=t.note||(t.amount>=0?'Остаток с прошлого месяца':'Перенесено в следующий месяц');sign=t.amount>=0?'+':'→';ini='↪️'}
  else if(t.type==='saving'){cls='sav';const g=S.goals.find(g=>g.id===t.goalId);title=(t.amount>=0?'В копилку: ':'Из копилки: ')+(g?g.title:'без цели');sign=t.amount>=0?'→':'←';ini='€'}
  const sub=[t.type==='carry'?'':t.note,tagsOf(t).map(g=>'#'+g).join(' '),whoName(t.who)?'внёс(ла) '+whoName(t.who):''].filter(Boolean).join(', ');
  return '<button class="item" data-act="edit-tx" data-id="'+esc(t.id)+'"><span class="badge b-'+cls+'">'+esc(ini)+'</span><span class="t"><div class="a">'+esc(title)+'</div>'+(sub?'<div class="b">'+esc(sub)+'</div>':'')+'</span><span class="amt num c-'+cls+'">'+sign+' '+money(Math.abs(t.amount))+'</span></button>';
}
function matches(t,q){
  const g=t.type==='saving'?S.goals.find(g=>g.id===t.goalId):null;
  const dbt=t.debtId?S.debts.find(x=>x.id===t.debtId):null;
  const hay=[t.note,t.category,g&&g.title,dbt&&dbt.title,tagsOf(t).map(x=>x+' #'+x).join(' '),String(t.amount),String(t.amount).replace('.',','),whoName(t.who)].join(' ').toLowerCase();
  return q.split(/\s+/).every(w=>hay.includes(w));
}
function vOps(){
  return '<div class="search"><input id="q" type="search" placeholder="Поиск по всем операциям" value="'+esc(S.q)+'" autocomplete="off"></div><div id="opsList">'+opsList()+'</div>';
}
function opsList(){
  const q=S.q.trim().toLowerCase();const f=S.txFilter;
  let list=q?S.tx.filter(t=>matches(t,q)):S.day?S.tx.filter(t=>t.date===S.day):S.tx.filter(t=>t.date&&t.date.slice(0,7)===S.month);
  list=list.filter(t=>f==='all'||t.type===f).sort((a,b)=>a.date===b.date?(b.createdAt||0)-(a.createdAt||0):(a.date<b.date?1:-1));
  let h=(S.day&&!q?'<div class="row" style="margin:0 4px 10px"><b>Операции за '+dayLabel(S.day)+'</b><button class="link small" data-act="day-clear">Весь месяц</button></div>':'')+'<div class="chips">'+[['all','Все'],['expense','Расходы'],['income','Доходы'],['saving','Накопления']].map(([k,l])=>'<button class="chip" data-act="filter" data-v="'+k+'" aria-pressed="'+(f===k)+'">'+l+'</button>').join('')+'</div>';
  if(q){const sum=list.reduce((s,t)=>s+(t.type==='income'?1:-1)*Math.abs(Number(t.amount)||0),0);
    h+='<p class="small muted" style="margin:0 4px 10px">'+(list.length?'Найдено '+list.length+' за всё время, итого '+money(Math.abs(sum)):'Ничего не найдено. Попробуйте часть слова или сумму')+'</p>';}
  if(!list.length)return h+(q?'':'<div class="card empty"><b>Операций пока нет</b>Нажмите «+», чтобы внести доход или расход за этот месяц.</div>');
  h+='<section class="card">';let last='';
  const dayExp={};for(const t of list)if(t.type==='expense')dayExp[t.date]=(dayExp[t.date]||0)+(Number(t.amount)||0);
  for(const t of list){if(t.date!==last){h+='<div class="day"><span>'+dayLong(t.date,!!q)+'</span>'+(dayExp[t.date]?'<span class="num">−'+money(dayExp[t.date])+'</span>':'')+'</div>';last=t.date}h+=txRow(t)}
  return h+'</section>';
}

function debtsCard(){

function barChart(data,dense){

    '<div class="legend" style="grid-auto-flow:column;justify-content:start;gap:18px"><span class="small"><i class="dot" style="background:var(--inc)"></i>Доходы</span><span class="small"><i class="dot" style="background:var(--exp)"></i>Расходы</span></div>';
}
function vStats(){
  let h='<div class="seg"><button data-act="smode" data-v="months" aria-pressed="'+(S.statsMode==='months')+'">Месяцы</button><button data-act="smode" data-v="year" aria-pressed="'+(S.statsMode==='year')+'">Год</button><button data-act="smode" data-v="tags" aria-pressed="'+(S.statsMode==='tags')+'">Метки</button><button data-act="smode" data-v="awards" aria-pressed="'+(S.statsMode==='awards')+'">Награды</button></div>';

function vTags(){
  const m={};
  for(const t of S.tx)for(const g of tagsOf(t)){const k=g.toLowerCase();const r=m[k]||(m[k]={tag:g,exp:0,inc:0,n:0,from:t.date,to:t.date,cats:{}});
    const a=Math.abs(Number(t.amount)||0);if(t.type==='expense'){r.exp+=a;r.cats[t.category]=(r.cats[t.category]||0)+a}else if(t.type==='income')r.inc+=a;r.n++;if(t.date<r.from)r.from=t.date;if(t.date>r.to)r.to=t.date;}
  const list=Object.values(m).sort((a,b)=>a.to<b.to?1:-1);
  if(!list.length)return '<div class="card empty"><b>Меток пока нет</b>Добавьте метку к операциям — например, «отпуск в Италии» на билетах, отеле и кафе, — и здесь будет видно, во сколько обошлась поездка целиком.</div>';
  const range=r=>r.from===r.to?dayLabel(r.from)+' '+r.from.slice(0,4):(r.from.slice(0,7)===r.to.slice(0,7)?r.from.slice(8).replace(/^0/,'')+'–'+dayLabel(r.to)+' '+r.to.slice(0,4):dayLabel(r.from)+' '+r.from.slice(0,4)+' – '+dayLabel(r.to)+' '+r.to.slice(0,4));
  return '<section class="card">'+list.map(r=>{const top=Object.entries(r.cats).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([c,v])=>c+' '+money(v)).join(', ');
    return '<button class="item" data-act="tagopen" data-v="'+esc(r.tag)+'"><span class="badge b-sav">#</span><span class="t"><div class="a">'+esc(r.tag)+'</div><div class="b">'+r.n+' '+plural(r.n,'операция','операции','операций')+', '+range(r)+(top?'. '+esc(top):'')+'</div></span><span class="amt num c-exp">'+money(r.exp)+'</span></button>'}).join('')+'</section>'+
    '<p class="small muted" style="margin:0 4px">Нажмите на метку, чтобы увидеть все её операции.</p>';
}
function vMonths(){
  const ms=[];for(let i=5;i>=0;i--)ms.push(shiftMonth(S.month,-i));
  const data=ms.map(m=>({m,...sums(m)}));
  let h=calendarCard(S.month)+'<section class="card"><h2>Последние 6 месяцев</h2>'+barChart(data)+'</section>';
  h+='<section class="card"><div class="tbl"><div class="th">Месяц</div><div class="th">Доходы</div><div class="th">Расходы</div><div class="th">Отложено</div>'+
    data.slice().reverse().map(d=>'<div>'+MONTHS[Number(d.m.slice(5))-1].slice(0,3)+' '+d.m.slice(2,4)+'</div><div class="num c-inc">'+money(d.inc)+'</div><div class="num c-exp">'+money(d.exp)+'</div><div class="num c-sav">'+money(d.sav)+'</div>').join('')+'</div></section>';

  // trends vs 3 previous months
  const cur=sums(S.month);const prev=[1,2,3].map(i=>sums(shiftMonth(S.month,-i))).filter(d=>d.exp>0);
  const mi=Number(S.month.slice(5))-1;
  h+='<section class="card"><h2>По сравнению с обычным</h2>';
  if(!prev.length){h+='<p class="small muted" style="margin:0">Сравнение появится, когда накопятся данные хотя бы за один прошлый месяц.</p></section>';return h}
  const avgExp=prev.reduce((s,d)=>s+d.exp,0)/prev.length;
  const partial=S.month===curMonth()?' (месяц ещё не закончился)':'';
  const dTot=pct(cur.exp,avgExp);
  h+='<div class="trend">Расходы в '+MPREP[mi]+': <b class="num">'+money(cur.exp)+'</b><div class="b">'+(Math.abs(dTot)<5?'примерно как обычно':(dTot>0?'на '+dTot+'% больше':'на '+(-dTot)+'% меньше')+' среднего ('+money(avgExp)+')')+partial+'</div></div>';
  const names=new Set([...Object.keys(cur.cats),...prev.flatMap(d=>Object.keys(d.cats))]);
  const rows=[];
  for(const c of names){const avg=prev.reduce((s,d)=>s+(d.cats[c]||0),0)/prev.length,v=cur.cats[c]||0;
    if(Math.abs(v-avg)<10)continue;
    if(avg===0){if(v>=20)rows.push({c,v,avg,diff:v,txt:'новая трата в этом месяце'});continue}
    const p=pct(v,avg);if(Math.abs(p)<15)continue;
    rows.push({c,v,avg,diff:v-avg,txt:(p>0?'на '+p+'% больше':'на '+(-p)+'% меньше')+' обычного ('+money(v)+' при среднем '+money(avg)+')'});}
  rows.sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff));
  h+=rows.slice(0,6).map(r=>'<div class="trend"><span class="'+(r.diff>0?'c-exp':'c-inc')+'">'+(r.diff>0?'▲ ':'▼ ')+'</span>'+esc(r.c)+'<div class="b">'+r.txt+'</div></div>').join('');
  if(!rows.length)h+='<div class="trend small muted">По категориям заметных отклонений нет.</div>';
  return h+'<p class="small muted" style="margin:10px 0 0">Среднее считается по '+prev.length+' предыдущ'+(prev.length===1?'ему месяцу':'им месяцам')+'.</p></section>';
}
function vYear(){
  const y=S.month.slice(0,4);const ms=[];for(let i=1;i<=12;i++)ms.push(y+'-'+pad(i));
  const data=ms.map(m=>({m,...sums(m)}));
  const inc=data.reduce((s,d)=>s+d.inc,0),exp=data.reduce((s,d)=>s+d.exp,0),sav=data.reduce((s,d)=>s+d.sav,0);
  const active=data.filter(d=>d.n>0);
  if(!active.length)return '<div class="card empty"><b>За '+y+' год данных нет</b>Переключите год стрелками вверху.</div>';
  const rate=inc?Math.round(sav/inc*100):0;
  let h='<div class="stats"><div class="stat"><div class="l">Доходы за год</div><div class="v num c-inc">'+money(inc)+'</div></div><div class="stat"><div class="l">Расходы за год</div><div class="v num c-exp">'+money(exp)+'</div></div>'+
    '<div class="stat"><div class="l">Отложено</div><div class="v num c-sav">'+money(sav)+'</div></div><div class="stat"><div class="l">Осталось сверху</div><div class="v num">'+money(inc-exp-sav)+'</div></div></div>';
  const withExp=active.filter(d=>d.exp>0);
  const avg=withExp.length?exp/withExp.length:0;
  const top=withExp.slice().sort((a,b)=>b.exp-a.exp)[0];
  h+='<section class="card"><h2>Как прошёл '+y+' год</h2><div class="verdict" style="margin:0;padding:0;border:0">'+
    (inc?'Вы откладывали <b>'+rate+'%</b> дохода. ':'')+
    (avg?'В среднем уходило <b class="num">'+money(avg)+'</b> в месяц'+(top&&withExp.length>1?', больше всего — в '+MPREP[Number(top.m.slice(5))-1]+' ('+money(top.exp)+')':'')+'.':'')+
    '</div><div style="margin-top:14px">'+barChart(data,true)+'</div></section>';
  const cats={};data.forEach(d=>{for(const c in d.cats)cats[c]=(cats[c]||0)+d.cats[c]});
  if(Object.keys(cats).length)h+='<section class="card"><h2>Куда ушли деньги</h2>'+groupList(cats,exp)+'</section>'+needWantCard(cats,'за год');
  return h;
}

function unlockScroll(){const s=scroller();if(s)s.style.overflowY=''}
function openSheet(html){$('#sheet').style.transform='';$('#overlay').style.background='';$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#overlay').classList.add('open');lockScroll();const f=$('#sheet').querySelector('[autofocus]');if(f&&!('ontouchstart' in window))f.focus()}

// swipe a sheet down to close it (from the handle, or from anywhere when the sheet is scrolled to the top)
(function(){
  let d=null;const sh=()=>$('#sheet');
  document.addEventListener('touchstart',e=>{
    if(!$('#overlay').classList.contains('open'))return;const s=e.target.closest('.sheet');if(!s)return;
    if(e.target.closest('.tpls,.sprow input,textarea'))return;
    const fromGrab=!!e.target.closest('.grab');if(!fromGrab&&s.scrollTop>0)return;
    d={y:e.touches[0].clientY,t:Date.now(),dy:0,on:false,grab:fromGrab};
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!d)return;const s=sh();const dy=e.touches[0].clientY-d.y;
    if(!d.on){if(dy>8&&(d.grab||s.scrollTop<=0)){d.on=true;d.y+=8;s.classList.add('dragging');if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}else if(dy<-6||Math.abs(dy)<=8){if(dy<-6)d=null;return}}
    e.preventDefault();d.dy=Math.max(0,dy-8);s.style.transform='translateY('+d.dy+'px)';
    $('#overlay').style.background='rgba(5,4,15,'+(0.5*Math.max(0,1-d.dy/400)).toFixed(3)+')';
  },{passive:false});
  const end=()=>{
    if(!d)return;const s=sh();const was=d;d=null;if(!was.on)return;
    s.classList.remove('dragging');const v=was.dy/Math.max(1,Date.now()-was.t);
    if(was.dy>110||v>0.6){s.style.transform='translateY(100%)';setTimeout(()=>{closeSheet();s.style.transform='';$('#overlay').style.background=''},200)}
    else{s.style.transform='';$('#overlay').style.background=''}
  };

})();
// iOS: block swipes that would drag the whole page (white space above/below the app)

const opt=(arr,sel)=>{const a=arr.includes(sel)||!sel?arr:[...arr,sel];return a.map(c=>'<option'+(c===sel?' selected':'')+'>'+esc(c)+'</option>').join('')};

function suggestCat(note,type){

function saveSheet(){
  const s=sheetState;
  if(s.kind==='limits'){
    let bad=false;const rd=id=>{const r=val(id);if(!r)return 0;const n=parseAmt(r);if(!(n>0)){bad=true;return 0}return n};
    const upd=expGroups().map((g,gi)=>({gl:rd('lg-'+gi),items:g.items.map((it,ii)=>$('#li-'+gi+'-'+ii)?rd('li-'+gi+'-'+ii):it.limit||0)}));

      else{if(s.orig)expGroups()[s.gi].items.splice(s.ii,1);expGroups()[gi2].items.push(item)}
    } else {
      if(name!==old&&cfg().income.some(i=>i.name===name))return err('Такая категория уже есть. Чтобы соединить их, используйте «Объединить».');
      const item={...(s.orig||{}),name,icon,hidden};

    const date=val('f-date');if(!date)return err('Выберите дату');
    const o=s.orig||{};
    const tags=parseTags(val('f-tags'));
    const data={type:s.type,amount:amt,category:val('f-cat'),date,note:val('f-note'),tags,who:o.who||myId||'',createdAt:o.createdAt||Date.now()};
    if(o.plannedId)data.plannedId=o.plannedId;
    if(o.debtId)data.debtId=o.debtId;
    syncSplit();
    const parts=(s.split||[]).map(r=>({cat:r.cat,amt:parseAmt(r.amt)})).filter(r=>r.amt>0);
    if(parts.length){
      const rest=Math.round((amt-parts.reduce((x,r)=>x+r.amt,0))*100)/100;
      if(rest<0)return err('Части чека больше общей суммы на '+money(-rest));
      const all=(rest>0?[{cat:data.category,amt:rest}]:[]).concat(parts);
      all.forEach((r,i)=>write(()=>db.collection('tx').doc().set({...data,category:r.cat,amount:r.amt,createdAt:Date.now()+i})));
      closeSheet();toast('Чек разделён на '+all.length+' '+plural(all.length,'операцию','операции','операций'));
      if(date.slice(0,7)!==S.month&&!S.q){S.month=date.slice(0,7);render()}
      return;
    }
    const asTpl=$('#f-tpl')&&$('#f-tpl').checked;
    const ref=s.id?db.doc('tx/'+s.id):db.collection('tx').doc();
    write(()=>ref.set(data));
    if(asTpl)write(()=>db.collection('templates').doc().set({title:data.note||data.category,type:data.type,amount:amt,category:data.category,note:data.note,createdAt:Date.now()}));
    closeSheet();toast(s.id?'Изменения сохранены':(s.type==='income'?'Доход добавлен':'Расход добавлен')+(asTpl?', шаблон сохранён':''));
    if(date.slice(0,7)!==S.month&&!S.q){S.month=date.slice(0,7);render()}
    return;
  }
  if(s.kind==='plan'){
    const title=val('f-title');if(!title)return err('Введите название');
    const amt=parseAmt(val('f-amt'));if(!(amt>0))return err('Введите сумму больше нуля');
    const date=val('f-date');if(!date)return err('Выберите дату');
    const o=s.orig||{};
    const data={title,amount:amt,dueDate:date,repeat:val('f-rep')||'none',category:val('f-cat'),paid:!!o.paid,createdAt:o.createdAt||Date.now(),flow:s.flow,debtId:s.flow==='income'?'':val('f-debt')};

    const dm=val('f-dm'),dy=val('f-dy');const deadline=dm?dy+'-'+dm:'';
    if(deadline&&deadline<curMonth())return err('Выберите текущий или будущий месяц');
    if(deadline&&!tg)return err('Чтобы получить план, укажите, сколько нужно накопить');
    const unit=val('f-unit'),ur=val('f-uprice');const uprice=ur?parseAmt(ur):0;if(ur&&!(uprice>0))return err('Цена единицы должна быть больше нуля');
    const id=s.id||newId();
    write(()=>db.doc('goals/'+id).set({title,target:tg||0,deadline,unit,unitPrice:uprice||0,milestones:o.milestones||'',createdAt:o.createdAt||Date.now()}));
    if(s.photo){S.photos[id]=s.photo;run('savePhoto',id,s.photo).catch(e=>toast('Фото не сохранилось: '+((e&&e.message)||'')))}
    if(s.photoDel){delete S.photos[id];run('deletePhoto',id).catch(()=>{})}
    closeSheet();toast(s.id?'Цель изменена':'Цель создана');return;
  }
  if(s.kind==='carry'){
    const r=val('f-cs');const sv=r?parseAmt(r):0;if(r&&!(sv>=0))return err('Введите сумму');if(sv>s.L+0.005)return err('Остаток всего '+money(s.L));
    doCarry(s.m,sv,val('f-goal'));closeSheet();render();return;
  }
  if(s.kind==='challenge'){
    const cat=val('f-chc');const r=val('f-chl');const lim=r?parseAmt(r):0;if(r&&!(lim>=0))return err('Введите сумму или оставьте 0');
    const t=today();write(()=>db.collection('challenges').doc().set({category:cat,limit:lim||0,start:t,end:addDays(t,6),createdAt:Date.now()}));
    closeSheet();toast('Челлендж начался! Удачи 💪');return;
  }
  if(s.kind==='debt'){
    const title=val('f-title');if(!title)return err('Введите название');
    const tot=parseAmt(val('f-amt'));if(!(tot>0))return err('Введите сумму больше нуля');
    const rm=val('f-mon');const mon=rm?parseAmt(rm):0;if(rm&&!(mon>0))return err('Платёж в месяц должен быть больше нуля');
    const rd=val('f-day');const day=rd?parseInt(rd,10):0;
    if(rd&&!(day>=1&&day<=31))return err('Число месяца — от 1 до 31');
    const o=s.orig||{};const id=s.id||newId();const cat=val('f-cat');
    write(()=>db.doc('debts/'+id).set({title,dir:s.dir,total:tot,monthly:mon||0,category:cat,payDay:s.dir==='owe'?day:0,createdAt:o.createdAt||Date.now()}));
    let msg=s.id?'Сохранено':'Добавлено';
    if(s.dir==='owe'&&mon>0&&day){
      const left=Math.max(0,tot-debtPaid({id}));const ex=S.planned.find(p=>p.debtId===id&&!p.paid);
      if(left>0){const amount=Math.min(mon,left);
        if(ex)write(()=>db.doc('planned/'+ex.id).update({title,amount,category:cat,dueDate:onDay(ex.dueDate.slice(0,7),day)}));
        else{write(()=>db.collection('planned').doc().set({title,amount,dueDate:nextDue(day),repeat:'month',category:cat,paid:false,flow:'expense',debtId:id,createdAt:Date.now()}));
          msg+='. Ежемесячный платёж — в обязательных платежах';}
      }
    }
    closeSheet();toast(msg);return;
  }
  if(s.kind==='debtpay'){
    const amt=parseAmt(val('f-amt'));if(!(amt>0))return err('Введите сумму больше нуля');
    const date=val('f-date');if(!date)return err('Выберите дату');const d=s.debt,owe=d.dir!=='lent';
    write(()=>db.collection('tx').doc().set({type:owe?'expense':'income',amount:amt,category:d.category||'Другое',date,note:d.title,debtId:d.id,who:myId||'',createdAt:Date.now()}));

function deleteSheet(){
  const s=sheetState;const k={tx:'tx',contrib:'tx',plan:'planned',goal:'goals',debt:'debts'}[s.kind];
  const sid=s.id;const obj=S[k].find(x=>x.id===sid);if(!obj)return closeSheet();
  const copy=JSON.parse(JSON.stringify(obj));delete copy.id;
  const extra=k==='debts'?S.planned.filter(p=>p.debtId===sid&&!p.paid).map(p=>JSON.parse(JSON.stringify(p))):[];
  extra.forEach(p=>write(()=>db.doc('planned/'+p.id).delete()));
  const pair=obj.type==='carry'&&obj.pairId?S.tx.filter(x=>x.pairId===obj.pairId&&x.id!==sid).map(x=>JSON.parse(JSON.stringify(x))):[];
  pair.forEach(p=>write(()=>db.doc('tx/'+p.id).delete()));
  if(pair.length){const m0=(obj.amount<0?obj.date:pair[0].date).slice(0,7);LS.set('carry-'+m0,'');}
  write(()=>db.doc(k+'/'+sid).delete());closeSheet();
  const id=obj.id;
  toast(extra.length?'Удалено вместе с ежемесячным платежом':'Удалено',{label:'Вернуть',fn:()=>{write(()=>db.doc(k+'/'+id).set(copy));pair.forEach(p=>{const c={...p};delete c.id;write(()=>db.doc('tx/'+p.id).set(c))});extra.forEach(p=>{const c={...p};delete c.id;write(()=>db.doc('planned/'+p.id).set(c))});toast('Восстановлено')}});
}
function pay(id){
  const p=S.planned.find(x=>x.id===id);if(!p)return;const inc=isInc(p);
  const baseDue=p.dueDate;
  const txo=localUpsert('tx',newId(),{type:inc?'income':'expense',amount:Number(p.amount)||0,category:p.category||'Другое',date:today(),note:p.title,plannedId:p.id,debtId:p.debtId||'',who:myId||'',createdAt:Date.now(),updatedAt:stamp()},false);
  let upd=p.repeat&&p.repeat!=='none'?{dueDate:addPeriod(p.dueDate,p.repeat)}:{paid:true};
  const d=p.debtId&&S.debts.find(x=>x.id===p.debtId);let done=false;
  if(d){const left=(Number(d.total)||0)-debtPaid(d);
    if(left<=0.005){upd={paid:true};done=true}
    else if(upd.dueDate){if(d.payDay)upd.dueDate=onDay(upd.dueDate.slice(0,7),d.payDay);upd.amount=Math.round(Math.min(Number(d.monthly)||p.amount,left)*100)/100}}
  upd.updatedAt=stamp();localUpsert('planned',p.id,upd,true);render();
  call('payPlanned',p.id,baseDue,txo,upd);
  toast(done?'Оплачено. Кредит «'+p.title+'» полностью погашен!':(inc?'Получено: ':'Оплачено: ')+p.title+(upd.dueDate?'. Следующий раз — '+dayLabel(upd.dueDate):''));
}
function reminders(fn,okMsg){
  run(fn).then(r=>{if(r&&r.owner!==undefined)S.reminders=r;render();toast(okMsg)}).catch(e=>toast((e&&e.message)||'Не получилось'));
}

document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]');if(tab){S.tab=tab.dataset.tab;S.day='';render();toTop();return}
  if(e.target.id==='overlay'){closeSheet();return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  const step=(S.tab==='stats'&&S.statsMode==='year')?12:1;
  switch(a){
    case 'prev':S.month=shiftMonth(S.month,-step);S.day='';render();break;

      if(!twoTap(b,'Точно удалить группу?'))break;

      saveCats();sheetState={ctype:'expense'};sheetSettings();toast('Группа удалена'+(items.length?', категории перенесены в «Прочее»':''));break}
    case 'new-debt':sheetDebt();break;

    case 'ddir':{const o=sheetState.orig;const keep={title:val('f-title'),total:parseAmt(val('f-amt'))||'',monthly:parseAmt(val('f-mon'))||'',payDay:val('f-day')};sheetDebt(o?{...o,...keep,category:''}:null,b.dataset.v);if(!o){$('#f-title').value=keep.title;$('#f-amt').value=keep.total?String(keep.total).replace('.',','):'';$('#f-mon').value=keep.monthly?String(keep.monthly).replace('.',','):''}else sheetState.orig=o;break}

      write(()=>db.collection('tx').doc().set(c));closeSheet();toast('Добавлено на сегодня: '+money(Math.abs(c.amount)));if(S.month!==curMonth()){S.month=curMonth();render()}break}

/* ---------- layout: fixed header height and the iOS home-screen viewport gap ---------- */
function safeInsets(){
  let p=document.getElementById('sa-probe');
  if(!p){p=document.createElement('div');p.id='sa-probe';p.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';document.body.appendChild(p)}
  const cs=getComputedStyle(p);return {top:parseFloat(cs.paddingTop)||0,bottom:parseFloat(cs.paddingBottom)||0};
}
function fitLayout(){
  const root=document.documentElement;
  const hd=document.querySelector('header');if(hd)root.style.setProperty('--hdr',hd.offsetHeight+'px');
  const sa=window.navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
  const vv=window.visualViewport;
  // part of the layout that iOS does not actually show at the bottom of the screen
  let hidden=0;
  if(vv)hidden=Math.round(innerHeight-(vv.height+vv.offsetTop));
  const ins0=safeInsets();
  if(sa&&window.screen&&!hidden&&ins0.top>0){const portrait=innerHeight>=innerWidth;const sh=portrait?Math.max(screen.width,screen.height):Math.min(screen.width,screen.height);
    const d=Math.round(sh-innerHeight);if(d>0&&d<=80)hidden=-1}      // window shorter than the screen: just drop the home-indicator padding
  hidden=hidden>0&&hidden<=120?hidden:(hidden===-1?-1:0);
  root.style.setProperty('--hide',(hidden>0?hidden:0)+'px');
  root.classList.toggle('vgap',hidden!==0);
  const ins=safeInsets();
  const probe=u=>{const d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;width:1px;visibility:hidden;height:100'+u;document.body.appendChild(d);const h=Math.round(d.getBoundingClientRect().height);d.remove();return h};
  let lvh='?';try{lvh=CSS.supports('height','100lvh')?probe('lvh'):'нет'}catch(e){}
  const sh0=window.screen?Math.max(screen.width,screen.height):0;
  const stretch=LSC.get('stretch')==='1'&&sa&&ins.top>0&&sh0>innerHeight;
  root.classList.toggle('stretch',stretch);root.style.setProperty('--below',(stretch?Math.round(sh0-innerHeight):0)+'px');
  if(stretch){root.classList.remove('vgap');root.style.setProperty('--hide','0px')}
  S.screenInfo='экран '+(window.screen?Math.max(screen.width,screen.height):'?')+', окно '+innerHeight+', видно '+(vv?Math.round(vv.height)+'+'+Math.round(vv.offsetTop):'?')+', отступы '+ins.top+'/'+ins.bottom+', '+(sa?'с главного экрана':'в браузере')+', скрыто '+hidden+', vh '+probe('vh')+', lvh '+lvh+(stretch?', растянуто':'');
}
window.addEventListener('resize',fitLayout);window.addEventListener('orientationchange',()=>setTimeout(fitLayout,300));
if(window.ResizeObserver){const hd=document.querySelector('header');if(hd)new ResizeObserver(fitLayout).observe(hd)}
if(window.visualViewport)visualViewport.addEventListener('resize',fitLayout);
fitLayout();setTimeout(fitLayout,500);

/* iOS: undo an accidental zoom after typing (keeps the app from sliding sideways) */
document.addEventListener('focusout',e=>{if(!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  const m=document.querySelector('meta[name=viewport]');if(!m)return;const c=m.getAttribute('content');
  m.setAttribute('content',c.replace(/,?\s*maximum-scale=[^,]*/,'')+', maximum-scale=1');setTimeout(()=>m.setAttribute('content',c),300)});

/* ---------- boot ---------- */
function applyTheme(){const t=LSX.get('theme')||'dark';if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme}
applyTheme();
window.__fb={get S(){return S},get outbox(){return outbox}};
if(GAS||CONN){try{const c=JSON.parse(LSX.get('cache')||'null');if(c&&c.tx){apply(c);S.fromCache=true;S.fresh=false}}catch(e){}}
render();syncBar();
if(GAS||CONN){if(outbox.length)flush();else load(true)}
if(!GAS&&'serviceWorker' in navigator&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))){
  // when a new version has been installed, reload once so it shows right away (not on the next launch)
  const hadController=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadController||reloaded)return;reloaded=true;
    if(!$('#overlay').classList.contains('open')&&!outbox.length)location.reload();else toast('Приложение обновлено — изменения появятся при следующем запуске')});
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{
    const check=()=>r.update().catch(()=>{});document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});setInterval(check,30*60e3);
  }).catch(()=>{});
}
setInterval(()=>{if((GAS||CONN)&&!document.hidden&&!outbox.length&&!$('#overlay').classList.contains('open'))load()},30000);
setInterval(()=>{if(outbox.length)flush()},15000);
window.addEventListener('online',()=>{S.offline=false;syncBar();if(!(GAS||CONN))return;if(outbox.length)flush();else load(true)});
window.addEventListener('offline',()=>{S.offline=true;syncBar()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(GAS||CONN)){if(outbox.length)flush();else load()}});
})();
